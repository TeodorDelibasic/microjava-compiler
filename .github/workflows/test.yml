name: E2E Tests

on:
  push:
    branches: [main, compiler-construction-2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate lexer
        run: java -jar lib/JFlex.jar -d ./src/rs/ac/bg/etf/pp1 spec/mjlexer.flex

      - name: Generate parser and AST
        run: java -jar lib/cup_v10k.jar -destdir src/rs/ac/bg/etf/pp1 -ast src.rs.ac.bg.etf.pp1.ast -parser Parser -buildtree spec/mjparser.cup

      - name: Fix package names
        run: find src -name "*.java" -exec sed -i 's/src\.rs\.ac\.bg\.etf\.pp1\.ast/rs.ac.bg.etf.pp1.ast/g' {} +

      - name: Compile
        run: javac -cp "lib/JFlex.jar:lib/cup_v10k.jar:lib/symboltable-1-1.jar:lib/mj-runtime-1.1.jar" src/rs/ac/bg/etf/pp2/ir/*.java src/rs/ac/bg/etf/pp2/*.java src/rs/ac/bg/etf/pp1/*.java src/rs/ac/bg/etf/pp1/ast/*.java

      - name: Run E2E tests
        run: bash test/run_tests.sh
